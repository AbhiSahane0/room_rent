# Render Blueprint for the API. In Render: New > Blueprint > pick this repo.
# Secrets marked `sync: false` are asked for in the Render dashboard on first deploy (never stored in git).
services:
  - type: web
    name: rent-manager-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter            # "free" also works but sleeps when idle (first request can take ~30s)
    region: singapore        # closest Render region to India; change if you prefer
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "90"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Supabase: use the "Session pooler" string (Connect > Session pooler; host aws-0-<region>.pooler.supabase.com, user postgres.<project>)
      # for BOTH DATABASE_URL and DIRECT_URL, and add ?connection_limit=5 to DATABASE_URL. Do NOT use the "Direct connection"
      # (db.<project>.supabase.co): it is IPv6 only and Render cannot reach it (error P1001).
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Cloudflare R2 (private bucket)
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      # Your Vercel address, e.g. https://rent-manager.vercel.app (comma-separate several)
      - key: CORS_ORIGINS
        sync: false
